<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز حبشي للعيون - محطة القطرات والتوسيع (Begol Dilation Hub)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/api.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .top-navbar { background-color: #1e293b; border-bottom: 2px solid #334155; }
        .patient-card { background: #1e293b; border-radius: 12px; border: 2px solid #334155; transition: all 0.3s ease; }
        .patient-card.dilating { border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
        .patient-card.ready { border-color: #10b981; background: #064e3b; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .timer-badge { font-family: monospace; font-size: 1.6rem; font-weight: bold; letter-spacing: 2px; }
        .eye-tag-od { background: #1e40af; color: white; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
        .eye-tag-os { background: #be123c; color: white; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
        .eye-tag-ou { background: #6b21a8; color: white; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="top-navbar py-2 px-4 shadow-sm mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="d-flex align-items-center">
                <span class="fs-3 me-2">💧</span>
                <div>
                    <h5 class="m-0 fw-bold text-warning">محطة قطرات وتوسيع قاع العين</h5>
                    <small class="text-slate-400" style="color: #94a3b8;">إدارة توقيتات التوسيع ومتابعة جاهزية حدقة المريض</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span id="activeCount" class="badge bg-warning text-dark fs-6 px-3 py-2">الحالات النشطة: 0</span>
                <a href="doctor.html" class="btn btn-outline-light btn-sm">👨‍⚕️ عيادة الطبيب</a>
                <a href="reception.html" class="btn btn-outline-light btn-sm">🌐 الاستقبال</a>
                <button class="btn btn-sm btn-outline-danger" onclick="sessionStorage.clear(); window.location.href='index.html'">خروج 🚪</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 flex-grow-1">
        <div class="row g-3" id="cardsGrid">
            <div class="text-center py-5 text-muted">
                <h4>⏳ جاري فحص أوامر التوسيع من العيادات...</h4>
            </div>
        </div>
    </div>

    <!-- صوت تنبيه خفيف عند اكتمال التوسيع -->
    <audio id="bellSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        let dilationCases = [];
        const timersMap = {};

        window.onload = function() {
            loadDilationQueue();
            initRealtime();
            setInterval(updateCountdowns, 1000);
        };

        function initRealtime() {
            try {
                db.channel('dilation-room')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'PatientQueue' }, () => {
                        loadDilationQueue();
                    })
                    .subscribe();
            } catch (e) { }
        }

        async function loadDilationQueue() {
            const today = new Date().toISOString().split('T')[0];
            try {
                const { data, error } = await db.from('PatientQueue')
                    .select('*, Patients(FullName, Age, Mobile1)')
                    .gte('ArrivedTime', today)
                    .in('Status', ['Dilating', 'DilationReady'])
                    .order('QueueID', { ascending: true });

                if (error) throw error;
                dilationCases = data || [];
                document.getElementById('activeCount').innerText = `الحالات النشطة: ${dilationCases.length}`;
                renderCards();
            } catch (e) { }
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            if (dilationCases.length === 0) {
                grid.innerHTML = `
                    <div class="col-12 text-center py-5" style="color:#64748b;">
                        <span style="font-size: 4rem;">👁️✨</span>
                        <h4 class="mt-3">لا توجد حالات تحت التوسيع حالياً</h4>
                        <p>أي أمر توسيع يرسله الطبيب من عيادته سيظهر هنا فوراً مع تايمر ذكي تلقائي.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = '';
            dilationCases.forEach(c => {
                const isReady = (c.Status === 'DilationReady');
                let targetEyeTag = '<span class="eye-tag-ou">العينين (OU)</span>';
                if ((c.DilationEye || '').includes('OD') || (c.DilationEye || '').includes('اليمنى')) targetEyeTag = '<span class="eye-tag-od">اليمنى (OD)</span>';
                else if ((c.DilationEye || '').includes('OS') || (c.DilationEye || '').includes('اليسرى')) targetEyeTag = '<span class="eye-tag-os">اليسرى (OS)</span>';

                // وقت التوسيع الافتراضي: 45 دقيقة لو سيكلوبنتوليت، 15 دقيقة لو ميدرياسيل عادي
                if (!timersMap[c.QueueID]) {
                    const durationMinutes = (c.DilationType || '').toLowerCase().includes('cyclo') ? 45 : 15;
                    timersMap[c.QueueID] = {
                        remainingSeconds: durationMinutes * 60,
                        totalMinutes: durationMinutes,
                        alertPlayed: isReady
                    };
                }

                grid.innerHTML += `
                    <div class="col-md-4 col-lg-3">
                        <div class="patient-card p-3 ${isReady ? 'ready' : 'dilating'}" id="card_${c.QueueID}">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-primary fs-6">دور #${c.QueueNumber}</span>
                                ${targetEyeTag}
                            </div>
                            
                            <h5 class="fw-bold mb-1 text-white">${c.Patients?.FullName || 'مريض'}</h5>
                            <small class="text-slate-400 d-block mb-3" style="color:#94a3b8;">
                                سن: ${c.Patients?.Age || '--'} سنة | د. ${c.DoctorName || 'العيادة'}
                            </small>

                            <div class="p-2 rounded bg-black bg-opacity-40 text-center mb-3">
                                <div class="text-xs text-uppercase text-warning mb-1">${c.DilationType || 'Mydriacyl 1%'}</div>
                                <div class="timer-badge ${isReady ? 'text-success' : 'text-warning'}" id="timer_${c.QueueID}">
                                    ${isReady ? 'جاهز للفحص ✅' : formatTime(timersMap[c.QueueID].remainingSeconds)}
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-warning w-50" onclick="addMinutes(${c.QueueID}, 5)">+5 دقايق</button>
                                <button class="btn btn-sm ${isReady ? 'btn-success' : 'btn-primary'} w-50 fw-bold" onclick="markReady(${c.QueueID})">
                                    ${isReady ? 'إرسال للدكتور ↩️' : 'جاهز الآن ✔️'}
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateCountdowns() {
            dilationCases.forEach(c => {
                if (c.Status === 'DilationReady') return;
                const t = timersMap[c.QueueID];
                if (!t) return;

                if (t.remainingSeconds > 0) {
                    t.remainingSeconds--;
                    const el = document.getElementById(`timer_${c.QueueID}`);
                    if (el) el.innerText = formatTime(t.remainingSeconds);
                } else if (!t.alertPlayed) {
                    t.alertPlayed = true;
                    playBell();
                    markReady(c.QueueID, false);
                }
            });
        }

        function addMinutes(queueId, mins) {
            if (timersMap[queueId]) {
                timersMap[queueId].remainingSeconds += (mins * 60);
                const el = document.getElementById(`timer_${queueId}`);
                if (el) el.innerText = formatTime(timersMap[queueId].remainingSeconds);
            }
        }

        async function markReady(queueId, promptUser = true) {
            try {
                await db.from('PatientQueue').update({ Status: 'DilationReady' }).eq('QueueID', queueId);
                const card = document.getElementById(`card_${queueId}`);
                if (card) {
                    card.className = 'patient-card p-3 ready';
                    const el = document.getElementById(`timer_${queueId}`);
                    if (el) el.innerText = 'جاهز للفحص ✅';
                }
                if (promptUser) {
                    alert('✅ تم إرسال إشعار فوري لعيادة الدكتور بأن حدقة المريض اتسعت وجاهز للكشف!');
                    loadDilationQueue();
                }
            } catch (e) { }
        }

        function playBell() {
            try { document.getElementById('bellSound').play(); } catch(e){}
        }
    </script>
</body>
</html>
