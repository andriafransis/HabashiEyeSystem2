<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز حبشي للعيون - مكتب القطرات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .top-navbar { background-color: #ffffff; border-bottom: 2px solid #e2e8f0; }
        .patient-card-prep { background: #fffbeb; border: 2px solid #fde68a; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .begol-footer { margin-top: auto; background: #ffffff; border-top: 1px solid #e2e8f0; padding: 12px 20px; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>

    <nav class="top-navbar py-2 px-4 shadow-sm mb-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="d-flex align-items-center">
                <span class="fs-4 me-2 text-warning">💧</span>
                <div>
                    <h5 class="m-0 fw-bold text-dark">مركز حبشي التخصصي للعيون</h5>
                    <small class="text-warning fw-bold">نظام بيجول • مكتب القطرات والتحضير</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="reception.html" class="btn btn-outline-primary btn-sm">🌐 الاستقبال</a>
                <a href="doctor.html" class="btn btn-outline-success btn-sm">👨‍⚕️ عيادة الطبيب</a>
                <span id="lblUserBadge" class="badge bg-light text-dark border p-2">👤 التمريض</span>
                <button class="btn btn-sm btn-outline-danger fw-bold" onclick="logout()">خروج 🚪</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 flex-grow-1">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center py-3">
                <span class="text-dark">💧 قائمة المرضى المنتظرين لتوسيع الحدقة</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadDilationQueue()">🔄 تحديث الطابور</button>
            </div>
            <div class="card-body p-3" id="dilationQueueContainer">
                <div class="text-muted text-center py-5">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <footer class="begol-footer text-center">نظام بيجول لإدارة مراكز العيون (Begol) • جميع الحقوق محفوظة © 2026</footer>

    <script>
        window.onload = function() {
            document.getElementById('lblUserBadge').innerText = `👤 ${sessionStorage.getItem('fullName') || 'التمريض'}`;
            loadDilationQueue();
            setInterval(loadDilationQueue, 7000);
        };

        async function loadDilationQueue() {
            const container = document.getElementById('dilationQueueContainer');
            if (!db) {
                container.innerHTML = '<div class="text-muted text-center py-5">لا توجد حالات حالياً</div>';
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const { data } = await db
                .from('queue')
                .select('*, patients(fullname)')
                .eq('visitdate', today)
                .in('status', ['Waiting', 'Dilating', 'DilationReady'])
                .order('queueid', { ascending: true });

            container.innerHTML = '';
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="text-muted text-center py-5">لا توجد حالات منتظرة للقطرات حالياً</div>';
                return;
            }

            data.forEach(item => {
                let statusBtn = `<button class="btn btn-warning btn-sm fw-bold px-3 text-dark" onclick="applyDrop(${item.queueid}, 'Dilating')">⏳ بدء وضع القطرة</button>`;
                if (item.status === 'Dilating') {
                    statusBtn = `<button class="btn btn-success btn-sm fw-bold px-3" onclick="applyDrop(${item.queueid}, 'DilationReady')">✅ اكتمال التوسيع</button>`;
                } else if (item.status === 'DilationReady') {
                    statusBtn = `<span class="badge bg-success fs-6 px-3 py-2">جاهز للفحص ✅</span>`;
                }

                container.innerHTML += `
                    <div class="patient-card-prep d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div>
                            <span class="badge bg-primary fs-6 me-2">دور #${item.queuenumber}</span>
                            <strong class="fs-5 text-dark">${item.patients?.fullname || 'مريض'}</strong>
                            <div class="mt-1">
                                <span class="badge bg-light text-danger border me-2">💧 النوع: ${item.dilationtype || 'ميدرياسيل'}</span>
                                <span class="badge bg-light text-primary border me-2">👁️ العين: ${item.dilationeye || 'العينين'}</span>
                            </div>
                        </div>
                        <div>${statusBtn}</div>
                    </div>`;
            });
        }

        async function applyDrop(queueid, status) {
            if (db) {
                await db.from('queue').update({ status }).eq('queueid', queueid);
                loadDilationQueue();
            }
        }
    </script>
</body>
</html>
