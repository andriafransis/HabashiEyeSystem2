<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز حبشي للعيون - شاشة النداء</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
        body { background-color: #0f172a; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        .queue-box { background: #1e293b; border: 3px solid #3b82f6; border-radius: 16px; padding: 25px; text-align: center; height: 85vh; display: flex; flex-direction: column; }
        .number-display { font-size: 7rem; font-weight: 900; color: #38bdf8; background: #0f172a; border-radius: 12px; padding: 20px; margin: 15px 0; border: 2px solid #334155; }
        .patient-name-display { font-size: 2.2rem; font-weight: bold; color: #f8fafc; }
        .dept-title { font-size: 1.8rem; font-weight: bold; color: #facc15; border-bottom: 2px solid #334155; padding-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container-fluid p-4">
        <div class="text-center mb-3">
            <h2 class="fw-bold text-light m-0">👁️ مركز حبشي التخصصي للعيون • شاشة نداء المرضى (Queue System)</h2>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="queue-box shadow-lg">
                    <div class="dept-title">🩺 عيادة الكشف الطبي</div>
                    <div class="my-auto">
                        <div class="text-muted small">رقم الدور الحالي:</div>
                        <div id="qClinicNum" class="number-display">--</div>
                        <div id="qClinicName" class="patient-name-display">في انتظار النداء...</div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="queue-box shadow-lg" style="border-color: #10b981;">
                    <div class="dept-title" style="color: #34d399;">⚡ وحدة الليزر والفحوصات</div>
                    <div class="my-auto">
                        <div class="text-muted small">رقم الدور الحالي:</div>
                        <div id="qLaserNum" class="number-display" style="color: #34d399;">--</div>
                        <div id="qLaserName" class="patient-name-display">في انتظار النداء...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            fetchPublicQueue();
            setInterval(fetchPublicQueue, 3000);
        };

        async function fetchPublicQueue() {
            if (!db) return;
            const today = new Date().toISOString().split('T')[0];

            const { data } = await db
                .from('queue')
                .select('*, patients(fullname)')
                .eq('visitdate', today)
                .in('status', ['Waiting', 'Dilating', 'Operating'])
                .order('queuenumber', { ascending: true });

            if (data && data.length > 0) {
                const clinic = data.find(x => x.department === 'عيادة الكشف');
                if (clinic) {
                    document.getElementById('qClinicNum').innerText = clinic.queuenumber;
                    document.getElementById('qClinicName').innerText = clinic.patients?.fullname || 'مريض';
                } else {
                    document.getElementById('qClinicNum').innerText = '--';
                    document.getElementById('qClinicName').innerText = 'لا توجد حالات حالية';
                }

                const laser = data.find(x => x.department === 'وحدة الليزر' || x.department === 'وحدة الفحوصات');
                if (laser) {
                    document.getElementById('qLaserNum').innerText = laser.queuenumber;
                    document.getElementById('qLaserName').innerText = laser.patients?.fullname || 'مريض';
                } else {
                    document.getElementById('qLaserNum').innerText = '--';
                    document.getElementById('qLaserName').innerText = 'لا توجد حالات حالية';
                }
            }
        }
    </script>
</body>
</html>
