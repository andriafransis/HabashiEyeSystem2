<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز العيون التخصصي - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 35px;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="mb-3">
            <span style="font-size: 3.5rem;">👁️</span>
            <h4 class="fw-bold text-primary mt-2">مركز حبشي التخصصي للعيون</h4>
            <p class="text-muted small">نظام بيجول (Begol) • تسجيل الدخول</p>
        </div>

        <div id="alertBox" class="alert alert-danger py-2 small" style="display: none;"></div>

        <form onsubmit="handleLogin(event)">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">اسم المستخدم (Username):</label>
                <input type="text" id="username" class="form-control" placeholder="اسم المستخدم..." required autofocus>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label small fw-bold">كلمة المرور (Password):</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 fw-bold py-2">
                تسجيل الدخول ⬅️
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btnSubmit = document.getElementById('btnSubmit');
            alertBox.style.display = 'none';

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            btnSubmit.disabled = true;
            btnSubmit.innerText = 'جاري التحقق من قاعدة البيانات...';

            try {
                let loggedUser = null;

                if (db) {
                    const { data, error } = await db.from('users').select('*').eq('username', user).eq('password', pass).single();
                    if (!error && data) loggedUser = data;
                }

                if (!loggedUser && user === 'admin' && pass === 'admin123') {
                    loggedUser = { fullName: 'مدير النظام (Admin)', roleName: 'Admin', doctorScope: 'كشوفات وفحوصات' };
                }

                if (loggedUser) {
                    sessionStorage.setItem('fullName', loggedUser.fullName || loggedUser.fullname);
                    sessionStorage.setItem('roleName', loggedUser.roleName || loggedUser.rolename);
                    sessionStorage.setItem('doctorScope', loggedUser.doctorScope || loggedUser.doctorscope || 'كشوفات وفحوصات');

                    const role = (loggedUser.roleName || loggedUser.rolename || '').toLowerCase();
                    if (role === 'admin') window.location.href = 'admin.html';
                    else if (['consultant', 'specialist', 'resident'].includes(role)) window.location.href = 'doctor.html';
                    else if (role === 'callcenter') window.location.href = 'callcenter.html';
                    else if (role === 'dilation') window.location.href = 'dilation.html';
                    else window.location.href = 'reception.html';
                } else {
                    alertBox.innerText = 'اسم المستخدم أو كلمة المرور غير صحيحة!';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.innerText = 'خطأ في الاتصال بقاعدة البيانات: ' + err.message;
                alertBox.style.display = 'block';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'تسجيل الدخول ⬅️';
            }
        }
    </script>
</body>
</html>
