<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز العيون التخصصي - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    
    <!-- مكتبة سوبابيز الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- استدعاء العميل والمحرك المركزي -->
    <script src="js/supabaseClient.js"></script>
    <script src="js/api.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 35px;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="mb-3">
            <span style="font-size: 3.5rem;">👁️</span>
            <h4 class="fw-bold text-primary mt-2">مركز حبشي للعيون</h4>
            <p class="text-muted small">نظام بيجول (Begol) • تسجيل الدخول</p>
        </div>

        <div id="alertBox" class="alert alert-danger py-2 small" style="display: none;"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">اسم المستخدم:</label>
                <input type="text" id="username" class="form-control" placeholder="admin" required autofocus>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label small fw-bold">كلمة المرور:</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 fw-bold py-2">
                تسجيل الدخول ⬅️
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btnSubmit = document.getElementById('btnSubmit');
            alertBox.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            btnSubmit.disabled = true;
            btnSubmit.innerText = 'جاري التحقق...';

            try {
                // التأكد من وجود محرك api أو العميل db
                let client = (typeof db !== 'undefined') ? db : (typeof _supabase !== 'undefined' ? _supabase : null);
                
                if (!client) {
                    throw new Error("لم يتم تحميل ملف js/supabaseClient.js أو المفاتيح بداخله غير صحيحة!");
                }

                // استعلام مباشر وصحيح لجدول Users بالحروف الكبيرة
                const { data, error } = await client
                    .from('Users')
                    .select('*, Roles(RoleName)')
                    .eq('Username', username)
                    .eq('IsActive', true)
                    .single();

                if (error || !data) {
                    alertBox.innerText = 'اسم المستخدم غير مسجل أو غير مفعل!';
                    alertBox.style.display = 'block';
                    return;
                }

                if (data.PasswordHash !== password) {
                    alertBox.innerText = 'كلمة المرور غير صحيحة!';
                    alertBox.style.display = 'block';
                    return;
                }

                // تخزين بيانات الجلسة
                const role = data.Roles?.RoleName || 'Consultant';
                sessionStorage.setItem('userId', data.UserID);
                sessionStorage.setItem('fullName', data.FullName);
                sessionStorage.setItem('roleName', role);
                sessionStorage.setItem('allowedScreens', data.AllowedScreens || 'all');
                sessionStorage.setItem('doctorScope', data.DoctorScope || 'كشوفات وفحوصات');

                // التوجيه للشاشة المناسبة بدون / لتوافق GitHub Pages
                const rLow = role.toLowerCase();
                if (rLow === 'admin') window.location.href = 'admin.html';
                else if (['doctor', 'consultant', 'resident', 'specialist'].includes(rLow)) window.location.href = 'doctor.html';
                else if (rLow === 'callcenter') window.location.href = 'callcenter.html';
                else if (rLow === 'dilation') window.location.href = 'dilation.html';
                else window.location.href = 'reception.html';

            } catch (err) {
                alertBox.innerText = 'خطأ في الاتصال بقاعدة البيانات: ' + err.message;
                alertBox.style.display = 'block';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'تسجيل الدخول ⬅️';
            }
        }
    </script>
</body>
</html>
